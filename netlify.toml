[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Bundle the PEM certificate files with the pkpass function so they are
# available on the Lambda filesystem at runtime.  The private key is NOT
# stored here — it stays in the APPLE_PASS_KEY_PEM environment variable.
[functions.generate-pkpass]
  included_files = ["netlify/functions/certs/*.pem"]

[dev]
  functions = "netlify/functions"
  publish = "dist"
  port = 8888
  targetPort = 5173

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# FLOW. community routes get their own statically-generated index.html (see
# scripts/generate-flow-static-html.mjs) so link-preview crawlers — which
# don't execute JS — see FLOW.'s own title/description/OG image instead of
# falling through to the site-wide index.html. Must come before the SPA
# catch-all below.
[[redirects]]
  from = "/projects/flow"
  to = "/projects/flow/index.html"
  status = 200

[[redirects]]
  from = "/projects/flow/cities"
  to = "/projects/flow/cities/index.html"
  status = 200

[[redirects]]
  from = "/projects/flow/events"
  to = "/projects/flow/events/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "*.mjs"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "*.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "*.png"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"

[[headers]]
  for = "*.ico"
  [headers.values]
    Content-Type = "image/x-icon" 